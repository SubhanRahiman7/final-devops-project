{{- if not .Values.postgres.existingSecret }}
{{- $name := include "helpdesk.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* keep the password stable across upgrades; generate a random one on first install */}}
  {{- if $existing }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ default (randAlphaNum 24) .Values.postgres.password | b64enc }}
  {{- end }}
{{- end }}
