name: CI/CD

# Every push and pull request is tested and scanned. Only pushes to main publish images and deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ 1. TEST
  backend-test:
    name: Backend - lint and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Tests (a failing test fails the pipeline; coverage gate 85 %)
        working-directory: backend
        run: pytest -v

  frontend-build:
    name: Frontend - npm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ------------------------------------------------------------------ 2. VALIDATE INFRASTRUCTURE + SECRETS
  validate-infra:
    name: Terraform, Helm and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt, init (no backend) and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Helm lint and template (default, dev and prod values)
        run: |
          helm lint helm/helpdesk
          helm lint helm/helpdesk -f helm/helpdesk/values-dev.yaml
          helm lint helm/helpdesk -f helm/helpdesk/values-prod.yaml
          helm template hd helm/helpdesk -f helm/helpdesk/values-dev.yaml > /dev/null
      - name: Trivy config scan - Terraform, Helm, Kubernetes, Dockerfiles (fails on HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:latest config \
            --severity HIGH,CRITICAL --exit-code 1 /repo

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole history, not only the last commit
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --no-banner --redact --verbose

  # ------------------------------------------------------------------ 3. BUILD + SECURITY SCAN + PUSH
  build-scan-push:
    name: Image - ${{ matrix.service }} (build, Trivy, push)
    needs: [backend-test, frontend-build, validate-infra, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry path must be lower case)
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/helpdesk-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (tag = Git commit SHA)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy image scan (report in the run summary; fails on fixable HIGH/CRITICAL CVEs)
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --format table "$IMAGE" | tee trivy.txt
          {
            echo "### Trivy - ${{ matrix.service }} image"
            echo "Scanned \`$IMAGE\` for HIGH and CRITICAL vulnerabilities (fixable ones only)."
            echo '```'
            grep -E "Total:|Report Summary|alpine|debian|python-pkg|node-pkg|^$" trivy.txt | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet "$IMAGE"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (only the scanned image, only from main)
        if: github.event_name == 'push'
        run: docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"

  # ------------------------------------------------------------------ 4. DEPLOY (throw-away kind cluster)
  deploy:
    name: Deploy with Helm to kind and smoke test
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: helpdesk-ci
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the images built for this commit and load them into the cluster
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in backend frontend; do
            docker pull "${REGISTRY}/${OWNER}/helpdesk-${svc}:${{ github.sha }}"
            kind load docker-image "${REGISTRY}/${OWNER}/helpdesk-${svc}:${{ github.sha }}" --name helpdesk-ci
          done
      - name: helm upgrade --install
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install helpdesk helm/helpdesk -n helpdesk \
            --set backend.image.repository="${REGISTRY}/${OWNER}/helpdesk-backend" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="${REGISTRY}/${OWNER}/helpdesk-frontend" \
            --set frontend.image.tag="${{ github.sha }}" \
            --set ingress.enabled=false --set backend.autoscaling.enabled=false \
            --wait --timeout 5m
      - name: helm test and smoke test
        run: |
          helm test helpdesk -n helpdesk
          kubectl -n helpdesk get pods,svc
          kubectl -n helpdesk port-forward svc/helpdesk-helpdesk-frontend 8080:80 &
          sleep 3
          curl -fsS http://localhost:8080/ | grep -qi helpdesk
          curl -fsS http://localhost:8080/api/tickets/stats
      - name: Show logs on failure
        if: failure()
        run: |
          kubectl -n helpdesk get pods -o wide || true
          kubectl -n helpdesk describe pods || true
          kubectl -n helpdesk logs -l app.kubernetes.io/component=backend --tail=80 || true
