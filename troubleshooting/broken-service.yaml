# LAB 2 - broken Service. Symptom to investigate: pods are Running and Ready, but the Service has no endpoints.
apiVersion: v1
kind: Namespace
metadata:
  name: helpdesk-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  namespace: helpdesk-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-api }
  template:
    metadata:
      labels: { app: lab-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api
  namespace: helpdesk-lab
spec:
  selector:
    app: lab-backend            # <-- the fault: the pods are labelled app=lab-api
  ports:
    - port: 80
      targetPort: 8080
