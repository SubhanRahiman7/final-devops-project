apiVersion: v1
data:
  helpdesk.json: |-
    {
     "uid": "helpdesk",
     "title": "HelpDesk - application metrics",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "10s",
     "time": {
      "from": "now-30m",
      "to": "now"
     },
     "tags": [
      "helpdesk"
     ],
     "panels": [
      {
       "id": 1,
       "title": "Requests per second (all endpoints)",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 5
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(rate(http_requests_total{namespace=\"helpdesk\"}[1m]))",
         "legendFormat": "",
         "refId": "A"
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 2,
       "title": "Error rate (5xx)",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 5
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "(sum(rate(http_requests_total{namespace=\"helpdesk\",status=\"5xx\"}[1m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{namespace=\"helpdesk\"}[1m])),0.001)",
         "legendFormat": "",
         "refId": "A"
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 3,
       "title": "Backend pods ready",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 5
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "count(kube_pod_status_ready{namespace=\"helpdesk\",condition=\"true\",pod=~\".*-backend-.*\"} == 1)",
         "legendFormat": "",
         "refId": "A"
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 4,
       "title": "Total requests",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 5
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum(http_requests_total{namespace=\"helpdesk\"})",
         "legendFormat": "",
         "refId": "A"
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 5,
       "title": "HTTP requests per second by endpoint",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 5,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (handler) (rate(http_requests_total{namespace=\"helpdesk\"}[1m]))",
         "legendFormat": "{{handler}}",
         "refId": "A"
        }
       ],
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       }
      },
      {
       "id": 6,
       "title": "p95 latency by endpoint",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 5,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{namespace=\"helpdesk\"}[1m])))",
         "legendFormat": "{{handler}}",
         "refId": "A"
        }
       ],
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       }
      },
      {
       "id": 7,
       "title": "Backend CPU per pod (cores)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 13,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"helpdesk\",container=\"backend\"}[1m]))",
         "legendFormat": "{{pod}}",
         "refId": "A"
        }
       ],
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       }
      },
      {
       "id": 8,
       "title": "Backend replicas (HPA)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 13,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"helpdesk\"}",
         "legendFormat": "current replicas",
         "refId": "A"
        }
       ],
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       }
      }
     ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: helpdesk-dashboard
  namespace: monitoring
